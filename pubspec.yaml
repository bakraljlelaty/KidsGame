name: little_wonder_world
description: "Little Wonder World - an offline-first toddler game (working title, see lib/config/app_config.dart)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.38.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/music/
    - assets/audio/effects/
    - assets/audio/voices/en/
    - assets/audio/voices/ar/
    - assets/config/
